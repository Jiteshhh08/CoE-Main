name: Hackathon Hub Pipeline

on:
  schedule:
    # Full pipeline daily — 02:00 AM IST = 20:30 UTC previous day.
    # discover + extract (10) + monitor.
    - cron: "30 20 * * *"
  workflow_dispatch:
    inputs:
      job:
        description: "Pipeline stage"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - discover
          - extract
          - monitor

jobs:
  hub-pipeline:
    runs-on: self-hosted

    steps:
      - name: Trigger hub pipeline
        shell: bash
        run: |
          JOB="${{ inputs.job || 'all' }}"

          echo "Triggering hub pipeline (job=$JOB) at $(date -u) UTC..."

          RESPONSE=$(curl -s -w "\n%{http_code}" -X GET \
            "https://tcetcercd.in/api/cron/hub?job=$JOB" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}")

          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | head -n -1)

          echo "HTTP Status: $HTTP_CODE"
          echo "Response: $BODY"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "ERROR: Hub pipeline failed with status $HTTP_CODE"
            exit 1
          fi

          echo "Hub pipeline slice completed successfully (bounded run — any remaining work is picked up by the next scheduled invocation)."
